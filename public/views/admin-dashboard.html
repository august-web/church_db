<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Church DB - Admin</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="container py-4">
    <div id="message" class="alert d-none"></div>

    <section class="card mb-4">
      <div class="card-body">
        <h5>Register Member</h5>
        <form id="registerMemberForm" class="row g-2">
          <div class="col-md-3"><input class="form-control" id="full_name" placeholder="Full Name" required></div>
          <div class="col-md-3"><input class="form-control" id="email" placeholder="Email" type="email" required></div>
          <div class="col-md-2"><input class="form-control" id="phone" placeholder="Phone" required></div>
          <div class="col-md-2"><input class="form-control" id="department" placeholder="Department"></div>
          <div class="col-md-2"><input class="form-control" id="password" placeholder="Temporary Password" required></div>
          <div class="col-md-12"><button class="btn btn-primary" type="submit">Create Member</button></div>
        </form>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h5>Members</h5>
        <div class="input-group mb-2">
          <input class="form-control" id="memberSearch" placeholder="Search by name, email, phone">
          <button class="btn btn-outline-secondary" id="searchBtn">Search</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-striped">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="membersTable"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h5>Record Contribution</h5>
        <form id="contributionForm" class="row g-2">
          <div class="col-md-3"><input class="form-control" id="memberId" placeholder="Member ID" required></div>
          <div class="col-md-3">
            <select class="form-select" id="contributionType" required>
              <option value="">Select Type</option>
              <option value="tithe">Tithe</option>
              <option value="offering">Offering</option>
              <option value="donation">Donation</option>
            </select>
          </div>
          <div class="col-md-3"><input class="form-control" id="amount" placeholder="Amount" type="number" min="0.01" step="0.01" required></div>
          <div class="col-md-3"><input class="form-control" id="contributionDate" type="date" required></div>
          <div class="col-md-12"><button class="btn btn-success" type="submit">Save Contribution</button></div>
        </form>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h5>All Contributions</h5>
        <div class="table-responsive">
          <table class="table table-sm table-striped">
            <thead><tr><th>ID</th><th>Member</th><th>Type</th><th>Amount</th><th>Date</th><th>SMS Sent</th></tr></thead>
            <tbody id="contributionsTable"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h5>Welfare Requests</h5>
        <div class="table-responsive">
          <table class="table table-sm table-striped">
            <thead><tr><th>ID</th><th>Member</th><th>Reason</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="welfareTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
