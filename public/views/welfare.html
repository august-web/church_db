<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welfare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <a href="/member" class="navbar-brand">← Back to Dashboard</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="container py-4">
    <div id="message" class="alert d-none"></div>
    <section class="card mb-3">
      <div class="card-body">
        <h5>Submit Welfare Request</h5>
        <form id="welfareForm" class="row g-2">
          <div class="col-md-8"><input id="reason" class="form-control" placeholder="Reason" required></div>
          <div class="col-md-4"><input id="amount" class="form-control" placeholder="Amount" type="number" min="0.01" step="0.01" required></div>
          <div class="col-12"><button class="btn btn-secondary" type="submit">Submit</button></div>
        </form>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <h5>My Welfare Requests</h5>
        <div class="table-responsive">
          <table class="table table-sm table-striped">
            <thead><tr><th>ID</th><th>Reason</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="welfareTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/welfare.js"></script>
</body>
</html>
